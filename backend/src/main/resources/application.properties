spring.application.name=sigma-v2

# Port HTTP. Hosting seperti Render menyuntikkan env var PORT sendiri --
# kalau tidak diset (mis. lokal/docker-compose), tetap default 8080.
server.port=${PORT:8080}

# Batas ukuran unggah berkas (mis. PDF pendukung PKPT) -- default Spring
# cuma 1MB, dinaikkan ke 10MB supaya cukup untuk dokumen PDF wajar.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Konfigurasi Database PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sigma_db}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER:sigma_user}
spring.datasource.password=${DB_PASSWORD:sigma_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Konfigurasi JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Konfigurasi JWT (masa berlaku sesuai constraint project: 8 jam)
app.jwt.secret=${JWT_SECRET:sigma-v2-dev-secret-key-please-change-in-production-min-32-bytes}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# Konfigurasi CORS (daftar origin frontend yang diizinkan, dipisah koma)
# Contoh saat hosting lewat Cloudflare Tunnel: CORS_ALLOWED_ORIGINS=https://<nama-acak>.trycloudflare.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# URL frontend yang dipakai untuk menyusun link di email reset password
# (mis. https://<nama-acak>.trycloudflare.com). Default localhost untuk dev.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Konfigurasi SMTP untuk fitur "Lupa Password". Isi MAIL_USERNAME &
# MAIL_PASSWORD di .env (untuk Gmail, MAIL_PASSWORD harus App Password,
# BUKAN password akun Gmail biasa -- buat di myaccount.google.com/apppasswords).
# Kalau belum diisi, fitur lupa password akan gagal saat dipakai (bukan saat
# start aplikasi), fitur lain tetap jalan normal.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
